 let h=`<section class="hz" id="hz"><div class="hzs"><div class="trk" id="trk"><div class="pn p1"><canvas class="flow" data-flow aria-hidden="true"></canvas><div class="shp" aria-hidden="true"><i class="s1" style="--k:0"></i><i class="s2" style="--k:1"></i><i class="s3" style="--k:2"></i><i class="s4" style="--k:3"></i><i class="s5" style="--k:4"></i></div><div class="in1 go"><div class="lab acc">Page 01 / 03</div><h1 style="margin-top:14px">${mk('Selected')}${mk('work')}</h1><p>Company profiles, websites, graphics, presentations, a career guide and a complete solar CRM. Each one opens as its own page.</p></div><div class="sh">Scroll, the page slides right <b>→</b></div></div>
<div class="pn p2"><div class="in2"><div class="lab acc">Page 02 / 03</div><h2>Some favs</h2></div><div class="dr">DRAG <b>← →</b></div><div class="gal" id="gal">${cards}</div></div></div><div class="hzp"><i id="hzi"></i></div></div></section>
<section class="p3" data-g><div class="lab acc">Page 03 / 03</div><h2>${mk('All works')}</h2><p>From here the page moves down. Every project, one after another.</p></section>`;
 P.forEach((p,i)=>{if(p.g)h+=`<section class="grp" data-g><div class="lab">Group</div><h3>${mk(p.g)}</h3></section>`;h+=`<a class="cv" href="#/p/${i}" data-i="${i}" data-g aria-label="Open ${p.t}"><canvas aria-hidden="true"></canvas><span class="no">${String(i+1).padStart(2,'0')} / ${String(P.length).padStart(2,'0')}</span><div class="meta"><div><div class="k">${p.k}</div><h2>${mk(p.t)}</h2></div><span class="ar" aria-hidden="true">→</span></div></a>`});
 return h+foot()}
function foot(){return `<footer class="foot" data-g><div class="lab">Have a project in mind?</div><a class="big" href="index.html#book">${mk("let's meet up!")}</a><div class="row"><a href="mailto:official.aksahoo@gmail.com">official.aksahoo@gmail.com</a><a href="#/connect">Social channels</a><a href="index.html">Back to the portfolio</a><span>© 2026 Amit Kumar Sahoo</span></div></footer>`}
function proj(i){const p=P[i],n=P[(i+1)%P.length],host=p.int?'index.html':new URL(p.u).host;
 return `<section class="pg" data-g><a class="lab" href="#/">← All works</a><div class="lab acc" style="margin-top:34px">${String(i+1).padStart(2,'0')} / ${String(P.length).padStart(2,'0')} · ${p.k}</div><h1>${mk(p.t)}</h1><div class="meta3"><div><b>Type</b><span>${p.k}</span></div><div><b>Link</b><span>${host}</span></div><div><b>About</b><span>${p.d}</span></div></div></section>
 <div class="bro" data-g><div class="bar"><i></i><i></i><i></i><span>${p.int?'Solar CRM & ERP · presentation inside the portfolio':p.u}</span></div><canvas aria-hidden="true" data-a="${p.a}"></canvas></div>
 <div class="acts" data-g>${p.int?`<a class="btn p" href="${p.u}">View the CRM presentation →</a>`:`<a class="btn p" href="${p.u}" target="_blank" rel="noopener">Visit live project ↗</a>`}<a class="btn" href="#/">All works</a></div>
 <a class="next" href="#/p/${(i+1)%P.length}" data-g><div class="lab">Next project</div><h2>${mk(n.t)}</h2></a>`}
function connect(){return `<section class="intro" data-g><h1>${mk('Connect')}${mk('everywhere')}</h1><p>Three places where the work, the thinking and the learning continue. Hover to feel each one, click to open the real thing.</p></section>
<div class="soc" data-g>
<a class="card ig" href="${SOC.ig}" target="_blank" rel="noopener" aria-label="Open Instagram"><div class="tag"><span>Instagram</span><span>Open ↗</span></div><div class="top"><div class="av"><div class="ring"></div><img src="${AV}" alt=""></div><div class="nm"><b>theamitkumarsahoo_</b><span class="lab">Amit Kumar Sahoo</span><br><span class="fol">Follow</span></div></div><div class="grid">${Array.from({length:9},(_,k)=>`<i style="--k:${k}"></i>`).join('')}</div><div class="hearts">${[8,24,40,58,72,86].map((l,k)=>`<b style="left:${l}%;--k:${k}">♥</b>`).join('')}</div><div class="open"><span>Open Instagram</span><i>↗</i></div></a>
<a class="card li" href="${SOC.li}" target="_blank" rel="noopener" aria-label="Open LinkedIn"><div class="tag"><span>LinkedIn</span><span>Open ↗</span></div><div class="ban"><canvas aria-hidden="true" data-d="1"></canvas></div><div class="av"><div class="ring"></div><img src="${AV}" alt=""></div><div class="info"><b>Amit Kumar Sahoo</b><p>Business Analyst · Operations · CRM · Process Improvement</p><small>Bhubaneswar, Odisha, India</small><div class="acts2"><span>＋ Connect</span><span>Message</span></div><div class="typing"><i></i><i></i><i></i><span style="margin-left:6px">building the network</span></div></div><div class="open"><span>Open LinkedIn profile</span><i>↗</i></div></a>
<a class="card yt" href="${SOC.yt}" target="_blank" rel="noopener" aria-label="Open YouTube channel"><div class="tag"><span>YouTube</span><span>Open ↗</span></div><div class="pl"><canvas aria-hidden="true" data-a="rays"></canvas><div class="pb"></div><div class="ctl"><div class="prog"><i></i></div></div></div><div class="ch"><div class="c"><img src="${AV}" alt=""></div><div><b>@officialdivexacademy</b><span class="lab">YouTube channel</span></div><span class="sub"><svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6V11a6 6 0 00-5-5.9V4a1 1 0 00-2 0v1.1A6 6 0 006 11v5l-2 2v1h16v-1z"/></svg>Subscribe</span></div><div class="open"><span>Open the channel</span><i>↗</i></div></a></div>${foot()}`}
/* LinkedIn banner: live connecting dots */
function dots(c){const x=c.getContext('2d');let w,h,V=true;const Q=Array.from({length:22},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.3,n:1}));const rz=()=>{w=c.clientWidth;h=c.clientHeight;c.width=w;c.height=h;Q.forEach(p=>{if(p.n){p.x*=w;p.y*=h;p.n=0}})};rz();new IntersectionObserver(e=>V=e[0].isIntersecting).observe(c);(function f(){if(!c.isConnected)return;if(V&&!document.hidden){x.clearRect(0,0,w,h);Q.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1});Q.forEach((p,i)=>{for(let j=i+1;j<Q.length;j++){const d=Math.hypot(p.x-Q[j].x,p.y-Q[j].y);if(d<70){x.strokeStyle=`rgba(255,255,255,${(1-d/70)*.6})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(Q[j].x,Q[j].y);x.stroke()}}x.fillStyle='#fff';x.beginPath();x.arc(p.x,p.y,2,0,TAU);x.fill()})}if(!RM)requestAnimationFrame(f)})()}
function render(){const h=location.hash||'#/';let html='',m;
 if(m=h.match(/^#\/p\/(\d+)$/)){const i=+m[1];if(P[i]){html=proj(i);document.title=P[i].t+' — Amit Kumar Sahoo'}else html=works()}
 else if(h==='#/connect'){html=connect();document.title='Connect — Amit Kumar Sahoo'}else{html=works();document.title='Projects — Amit Kumar Sahoo'}
 app.innerHTML=html;$$('.cv').forEach(a=>reg(a.querySelector('canvas'),P[a.dataset.i].a,.9));$$('canvas[data-g]').forEach(c=>reg(c,c.dataset.g,.8));hzInit();$$('canvas[data-a]').forEach(c=>reg(c,c.dataset.a,1));$$('canvas[data-d]').forEach(dots);wire();reveal();$('#menu').classList.remove('on');$('#mb').setAttribute('aria-expanded','false');$('#mbt').textContent='Menu'}
$('#mb').onclick=()=>{const on=$('#menu').classList.toggle('on');SND.whoosh(on?1:-1,.7,.16);SND.thump(.22);$('#mb').setAttribute('aria-expanded',on);$('#mbt').textContent=on?'Close':'Menu'};
$$('#menu a:not([data-veil])').forEach(a=>a.addEventListener('click',()=>{$('#menu').classList.remove('on');$('#mbt').textContent='Menu'}));
addEventListener('hashchange',()=>swap(render));addEventListener('keydown',e=>{if(e.key==='Escape')$('#menu').classList.remove('on')});
wire();render();
</script>
</body></html>
